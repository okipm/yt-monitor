<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#0e1420; --panel:#161e2e; --panel2:#1c2639; --ink:#eef2f8; --mute:#8e9ab2; --dim:#5d6982; --line:#243049;
    --up:#3fd68a; --err:#ff8a80;
    --c0:#8b6cff; --c1:#19c2b8; --c2:#f2b632; --c3:#3fbf6f; --c4:#4c8dff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Plus Jakarta Sans", system-ui, sans-serif; font-variant-numeric:tabular-nums; }
  a { color:inherit; text-decoration:none; }
  :focus-visible { outline:2px solid var(--c4); outline-offset:2px; }
  .wrap { max-width:1400px; margin:0 auto; padding:0 20px 32px; }

  header { display:flex; align-items:center; gap:24px; padding:20px 0; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.01em; }
  .totals { display:flex; gap:28px; flex:1; flex-wrap:wrap; }
  .totals div { color:var(--mute); font-size:12px; }
  .totals b { display:block; color:var(--ink); font-size:20px; font-weight:800; line-height:1.2; }
  .updated { color:var(--dim); font-size:12px; text-align:right; }
  button { font:inherit; font-weight:600; font-size:13px; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:var(--mute); }
  button[disabled] { opacity:.5; cursor:wait; }

  /* channel tiles: every channel visible at a glance */
  .tiles { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; }
  .tile { all:unset; box-sizing:border-box; cursor:pointer; position:relative; overflow:hidden; background:var(--panel); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; border:1px solid transparent; }
  .tile::before { content:""; position:absolute; inset:0 0 auto; height:90px; background:linear-gradient(180deg, color-mix(in srgb, var(--c) 28%, transparent), transparent); pointer-events:none; }
  .tile[aria-pressed="true"] { border-color:var(--c); }
  .tile:hover { background:var(--panel2); }
  .tile > * { position:relative; }
  .who { display:flex; gap:10px; align-items:center; min-width:0; }
  .who img { width:38px; height:38px; border-radius:50%; flex:none; box-shadow:0 0 0 2px var(--c); background:var(--line); }
  .who b { display:block; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who span { display:block; font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .big { font-size:30px; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .big small { font-size:12px; font-weight:500; color:var(--mute); letter-spacing:0; margin-left:4px; }
  .up { color:var(--up); font-weight:700; font-size:12px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px; color:var(--mute); }
  .split b { display:block; font-size:15px; color:var(--ink); font-weight:700; }
  .spark { display:flex; align-items:flex-end; gap:3px; height:36px; }
  .spark i { flex:1; background:var(--c); border-radius:2px 2px 0 0; min-height:2px; opacity:.85; }
  .spark i.s { opacity:.45; }
  .sparkcap { font-size:11px; color:var(--dim); margin-top:-6px; }

  /* video table */
  .panel { background:var(--panel); border-radius:14px; margin-top:16px; }
  .bar { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .bar h2 { margin:0; font-size:15px; font-weight:700; flex:1; }
  .seg { display:flex; background:var(--bg); border-radius:9px; padding:3px; }
  .seg button { border:0; background:none; color:var(--mute); padding:6px 12px; border-radius:7px; }
  .seg button[aria-pressed="true"] { background:var(--panel2); color:var(--ink); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:12px; font-weight:600; color:var(--dim); padding:10px 16px; }
  th.n, td.n { text-align:right; }
  th button { all:unset; cursor:pointer; } th button:hover { color:var(--ink); }
  td { padding:8px 16px; border-top:1px solid var(--line); vertical-align:middle; }
  tr:hover td { background:var(--panel2); }
  .vt { display:flex; gap:12px; align-items:center; min-width:0; }
  .th { flex:none; width:96px; height:54px; border-radius:7px; overflow:hidden; background:var(--line); }
  .th img { width:100%; height:100%; object-fit:cover; display:block; }
  .th.s { width:40px; height:54px; margin:0 28px; } .th.s img { transform:scale(1.8); }
  .vt .t { font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .vt a:hover .t { text-decoration:underline; }
  .chn { font-size:12px; color:var(--mute); display:flex; align-items:center; gap:6px; }
  .chn i { width:8px; height:8px; border-radius:50%; background:var(--c); }
  .pill { font-size:11px; font-weight:700; border-radius:6px; padding:2px 8px; background:var(--panel2); color:var(--mute); white-space:nowrap; }
  .pill.l { color:var(--ink); background:color-mix(in srgb, var(--c4) 30%, transparent); }
  .views { font-weight:700; font-size:15px; }
  .age { color:var(--mute); white-space:nowrap; }
  .empty { padding:28px 16px; color:var(--mute); text-align:center; }
  .err { color:var(--err); font-size:12px; }

  @media (max-width:1100px) { .tiles { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  @media (max-width:720px) {
    .wrap { padding:0 16px 24px; }
    .tiles { grid-template-columns:repeat(2, minmax(0, 1fr)); }
    .big { font-size:24px; }
    .hide-m { display:none; }
    td, th { padding-left:10px; padding-right:10px; }
    .th { width:72px; height:40px; } .th.s { width:30px; height:40px; margin:0 21px; }
    .updated { text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>YT Monitor</h1>
    <div class="totals" id="totals"></div>
    <div class="updated" id="meta">Memuat…</div>
    <button id="refresh">Refresh data</button>
  </header>
  <div class="tiles" id="tiles"></div>
  <div class="panel">
    <div class="bar">
      <h2 id="listTitle">Semua video</h2>
      <div class="seg" id="kind">
        <button data-k="all" aria-pressed="true">Semua</button>
        <button data-k="long" aria-pressed="false">Video panjang</button>
        <button data-k="shorts" aria-pressed="false">Shorts</button>
      </div>
    </div>
    <table>
      <thead><tr>
        <th>Video</th>
        <th class="hide-m">Jenis</th>
        <th class="hide-m"><button data-s="published">Diunggah</button></th>
        <th class="n"><button data-s="views">Views</button></th>
        <th class="n hide-m"><button data-s="delta">Naik</button></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
const fmt = n => n == null ? "–" : n.toLocaleString("id-ID");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = iso => { const h = (Date.now() - new Date(iso)) / 36e5; return h < 1 ? "baru saja" : h < 24 ? `${Math.round(h)} jam lalu` : `${Math.round(h / 24)} hari lalu`; };
const color = i => `var(--c${i % 5})`;
const state = { data: null, channel: null, kind: "all", sort: "published" };

function renderTop() {
  const { fetchedAt, channels } = state.data;
  const ok = channels.filter(c => !c.error);
  const sum = f => ok.reduce((s, c) => s + (f(c) || 0), 0);
  document.getElementById("totals").innerHTML = `
    <div><b>${fmt(sum(c => c.subs))}</b>subscriber</div>
    <div><b>${fmt(sum(c => c.longViews))}</b>views video panjang</div>
    <div><b>${fmt(sum(c => c.shortsViews))}</b>views Shorts</div>`;
  const sinceH = ok[0]?.since ? Math.round((fetchedAt - ok[0].since) / 3600) : 0;
  document.getElementById("meta").innerHTML =
    `Diperbarui ${new Date(fetchedAt * 1000).toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"})}<br>` +
    (sinceH ? `Kenaikan dihitung dari ${sinceH} jam lalu` : `Kenaikan muncul setelah beberapa jam`);

  document.getElementById("tiles").innerHTML = channels.map((c, i) => {
    if (c.error) return `<div class="tile" style="--c:${color(i)}"><div class="who"><div><b>${esc(c.handle)}</b><span class="err">Gagal dimuat. Klik Refresh data.</span></div></div></div>`;
    const recent = [...c.videos].sort((a, b) => a.published.localeCompare(b.published)).slice(-14);
    const max = Math.max(1, ...recent.map(v => v.views));
    const longIds = new Set(c.long.map(v => v.id));
    return `
    <button class="tile" style="--c:${color(i)}" data-ch="${i}" aria-pressed="${state.channel === i}">
      <div class="who"><img src="${esc(c.avatar)}" alt=""><div><b>${esc(c.title)}</b><span>${esc(c.handle)}</span></div></div>
      <div class="big">${fmt(c.subs)}<small>subs</small> ${c.subsDelta > 0 ? `<span class="up">+${fmt(c.subsDelta)}</span>` : ""}</div>
      <div class="split">
        <div><b>${fmt(c.longViews)}</b>${c.long.length} video panjang</div>
        <div><b>${fmt(c.shortsViews)}</b>${c.shorts.length} Shorts</div>
      </div>
      <div class="spark" aria-hidden="true">${recent.map(v => `<i class="${longIds.has(v.id) ? "" : "s"}" style="height:${Math.max(4, v.views / max * 100)}%" title="${esc(v.title)}: ${fmt(v.views)}"></i>`).join("")}</div>
      <div class="sparkcap">Views ${recent.length} upload terakhir, batang tegas = video panjang</div>
    </button>`;
  }).join("");
  document.querySelectorAll(".tile[data-ch]").forEach(t => t.onclick = () => {
    const i = +t.dataset.ch;
    state.channel = state.channel === i ? null : i;
    renderTop(); renderRows();
  });
}

function renderRows() {
  const chs = state.data.channels;
  let rows = chs.flatMap((c, i) => c.error || (state.channel !== null && state.channel !== i) ? [] :
    [...(state.kind !== "shorts" ? c.long.map(v => ({ ...v, ci: i, ch: c, long: true })) : []),
     ...(state.kind !== "long" ? c.shorts.map(v => ({ ...v, ci: i, ch: c, long: false })) : [])]);
  const key = state.sort;
  rows.sort((a, b) => key === "published" ? b.published.localeCompare(a.published) : (b[key] ?? -1) - (a[key] ?? -1));
  const kindLabel = { all: "Semua video", long: "Video panjang", shorts: "Shorts" }[state.kind];
  document.getElementById("listTitle").textContent = kindLabel + (state.channel !== null ? ` · ${chs[state.channel].title}` : "") + ` (${rows.length})`;
  document.getElementById("rows").innerHTML = rows.length ? rows.map(v => `
    <tr style="--c:${color(v.ci)}">
      <td><a class="vt" href="${esc(v.url)}" target="_blank" rel="noopener">
        <span class="th ${v.long ? "" : "s"}"><img src="${esc(v.thumb)}" alt="" loading="lazy"></span>
        <span><span class="t">${esc(v.title)}</span><span class="chn"><i></i>${esc(v.ch.title)}</span></span>
      </a></td>
      <td class="hide-m"><span class="pill ${v.long ? "l" : ""}">${v.long ? "Video" : "Shorts"}</span></td>
      <td class="hide-m age">${ago(v.published)}</td>
      <td class="n views">${fmt(v.views)}</td>
      <td class="n hide-m">${v.delta > 0 ? `<span class="up">+${fmt(v.delta)}</span>` : `<span class="age">–</span>`}</td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">Belum ada ${kindLabel.toLowerCase()} publik untuk pilihan ini.</td></tr>`;
}

document.getElementById("kind").onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  state.kind = k;
  document.querySelectorAll("#kind button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
  renderRows();
};
document.querySelectorAll("th button").forEach(b => b.onclick = () => { state.sort = b.dataset.s; renderRows(); });

const btn = document.getElementById("refresh");
async function load(refresh) {
  btn.disabled = true;
  // GitHub Pages has no server: read the data.json that GitHub Actions writes every hour
  const api = location.hostname.endsWith("github.io") ? "data.json?t=" + Date.now() : "/api/data" + (refresh ? "?refresh=1" : "");
  try { state.data = await (await fetch(api)).json(); renderTop(); renderRows(); }
  catch (e) { document.getElementById("meta").textContent = "Server tidak merespons. Pastikan server.py masih berjalan, lalu klik Refresh data."; }
  finally { btn.disabled = false; }
}
btn.onclick = () => load(true);
load();
setInterval(() => load(), 10 * 60 * 1000);
</script>
</body>
</html>
