name: update data
on:
  schedule: [{cron: "7 * * * *"}]  # every hour
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 server.py --build
      - run: |
          git config user.name "yt-monitor bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json history.json
          git commit -m "update data" || exit 0
          git push
